<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ranking Dinâmico de Setores</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 20px; 
        }
        .botoes-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-exportar {
            background-color: #28a745;
            color: white;
        }
        .btn-exportar:hover {
            background-color: #218838;
        }
        .btn-limpar {
            background-color: #dc3545;
            color: white;
        }
        .btn-limpar:hover {
            background-color: #c82333;
        }
        .info-timeout {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .timeout-ativo {
            color: #ff9800;
            font-weight: bold;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 1px solid #ddd; 
        }
        th { 
            background-color: #007bff; 
            color: white; 
        }
        input[type="number"] { 
            width: 100px; 
            padding: 6px; 
            font-size: 14px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            text-align: right; 
        }
        .center { 
            text-align: center; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ranking Dinâmico de Setores</h2>
    
    <div class="botoes-container">
        <button class="btn-exportar" onclick="exportarJSON()">📥 Exportar JSON</button>
        <button class="btn-exportar" onclick="exportarCSV()">📊 Exportar CSV</button>
        <button class="btn-limpar" onclick="limparDados()">🔄 Restaurar Padrão</button>
    </div>
    
    <div class="info-timeout">
        <span id="status-timeout">⏱️ Aguardando edição...</span>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Colocação</th>
                <th>Setor</th>
                <th>Porcentagem (%)</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
        </tbody>
    </table>
</div>

<script>
    const DADOS_PADRAO = [
        { setor: "Mercearia", porcentagem: 50.45 },
        { setor: "Perecíveis", porcentagem: 45.55 },
        { setor: "Bazar", porcentagem: 30.00 },
        { setor: "Açougue", porcentagem: 21.50 },
        { setor: "Padaria", porcentagem: 19.50 }
    ];

    let dados = [...DADOS_PADRAO];
    let timeoutId = null;
    const TEMPO_ESPERA = 5000; // 5 segundos

    function renderizar() {
        // Ordena os dados do maior para o menor com base na porcentagem
        dados.sort((a, b) => b.porcentagem - a.porcentagem);

        const tbody = document.getElementById("tabela-corpo");
        tbody.innerHTML = "";

        dados.forEach((item, index) => {
            let tr = document.createElement("tr");
            
            let tdColocacao = document.createElement("td");
            tdColocacao.className = "center";
            tdColocacao.innerText = `${index + 1}º`;
            
            let tdSetor = document.createElement("td");
            tdSetor.innerText = item.setor;
            
            let tdPorcentagem = document.createElement("td");
            let input = document.createElement("input");
            input.type = "number";
            input.step = "0.01";
            input.value = item.porcentagem;
            
            // Cancela o timeout anterior e aguarda 5 segundos antes de renderizar novamente
            input.oninput = (e) => {
                let val = parseFloat(e.target.value);
                item.porcentagem = isNaN(val) ? 0 : val;
                
                // Limpa o timeout anterior se existir
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                
                // Mostra que está aguardando
                document.getElementById('status-timeout').innerHTML = '<span class="timeout-ativo">⏱️ Atualizando em 5 segundos...</span>';
                
                // Define novo timeout
                timeoutId = setTimeout(() => {
                    renderizar();
                    document.getElementById('status-timeout').innerHTML = '✅ Ranking atualizado!';
                    setTimeout(() => {
                        document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
                    }, 2000);
                }, TEMPO_ESPERA);
            };
            
            tdPorcentagem.appendChild(input);
            tr.appendChild(tdColocacao);
            tr.appendChild(tdSetor);
            tr.appendChild(tdPorcentagem);
            tbody.appendChild(tr);
        });
    }

    function exportarJSON() {
        const dadosOrdenados = [...dados].sort((a, b) => b.porcentagem - a.porcentagem);
        const json = JSON.stringify(dadosOrdenados, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranking-setores-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function exportarCSV() {
        const dadosOrdenados = [...dados].sort((a, b) => b.porcentagem - a.porcentagem);
        let csv = 'Colocação,Setor,Porcentagem (%)\n';
        dadosOrdenados.forEach((item, index) => {
            csv += `${index + 1},"${item.setor}",${item.porcentagem}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranking-setores-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function limparDados() {
        if (confirm('Tem certeza que deseja restaurar os dados padrão?')) {
            dados = [...DADOS_PADRAO];
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            renderizar();
            document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
        }
    }

    renderizar();
</script>

</body>
</html>
