<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ranking Dinâmico de Setores</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 20px; 
        }
        .botoes-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-exportar {
            background-color: #28a745;
            color: white;
        }
        .btn-exportar:hover {
            background-color: #218838;
        }
        .btn-limpar {
            background-color: #dc3545;
            color: white;
        }
        .btn-limpar:hover {
            background-color: #c82333;
        }
        .info-timeout {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .timeout-ativo {
            color: #ff9800;
            font-weight: bold;
        }
        .meta-geral {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #333;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 1px solid #ddd; 
        }
        th { 
            background-color: #007bff; 
            color: white; 
        }
        input[type="number"] { 
            width: 100px; 
            padding: 6px; 
            font-size: 14px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            text-align: right; 
        }
        .center { 
            text-align: center; 
            font-weight: bold; 
        }
        #export-area {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ranking Dinâmico de Setores</h2>
    
    <div class="botoes-container">
        <button class="btn-exportar" onclick="exportarJSON()">📥 Exportar JSON</button>
        <button class="btn-exportar" onclick="exportarCSV()">📊 Exportar CSV</button>
        <button class="btn-exportar" onclick="exportarComoImagem()">🖼️ Exportar Imagem</button>
        <button class="btn-limpar" onclick="limparDados()">🔄 Restaurar Padrão</button>
    </div>

    <!-- Meta geral adicionada -->
    <div id="meta-geral" class="meta-geral">Meta geral (%): —</div>

    <div class="info-timeout">
        <span id="status-timeout">⏱️ Aguardando edição...</span>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Colocação</th>
                <th>Setor</th>
                <th>Porcentagem (%)</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
        </tbody>
    </table>
</div>

<!-- Área invisível para exportação em imagem -->
<div id="export-area">
    <div style="background: white; padding: 50px; width: 800px; font-family: Arial, sans-serif;">
        <h2 style="text-align: center; color: #333; margin-bottom: 30px; font-size: 32px;">Ranking Dinâmico de Setores</h2>
        
        <div style="background-color: #e7f3ff; padding: 25px; border-radius: 10px; margin-bottom: 30px; text-align: center; border: 3px solid #007bff;">
            <p style="margin: 0; font-size: 20px; color: #007bff; font-weight: bold;">Meta Geral</p>
            <p style="font-size: 40px; color: #0056b3; margin: 10px 0 0 0; font-weight: bold;" id="meta-valor-export">0.00%</p>
        </div>

        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="background-color: #007bff; color: white; padding: 15px; text-align: center; border: 2px solid #0056b3; font-size: 16px;">Colocação</th>
                    <th style="background-color: #007bff; color: white; padding: 15px; text-align: left; border: 2px solid #0056b3; font-size: 16px;">Setor</th>
                    <th style="background-color: #007bff; color: white; padding: 15px; text-align: right; border: 2px solid #0056b3; font-size: 16px;">Porcentagem (%)</th>
                </tr>
            </thead>
            <tbody id="tabela-export">
            </tbody>
        </table>
    </div>
</div>

<script>
    const DADOS_PADRAO = [
        { setor: "MERCEARIA", porcentagem: 0 },
        { setor: "PERECÍVEIS", porcentagem: 0 },
        { setor: "BAZAR", porcentagem: 0 },
        { setor: "AÇOUGUE", porcentagem: 0 },
        { setor: "PADARIA", porcentagem: 0 }
    ];

    let dados = [...DADOS_PADRAO];
    let timeoutId = null;
    const TEMPO_ESPERA = 5000; // 5 segundos

    function calcularMetaGeral() {
        const valores = dados
            .map(s => s.porcentagem)
            .filter(v => v !== null && v !== undefined && !isNaN(v));

        if (valores.length === 0) return null;
        const soma = valores.reduce((a, b) => a + b, 0);
        const media = soma / valores.length;
        return Math.round(media * 100) / 100; // duas casas
    }

    function atualizarMetaGeralNaTela() {
        const meta = calcularMetaGeral();
        const el = document.getElementById('meta-geral');
        if (meta === null) {
            el.innerText = 'Meta geral (%): —';
        } else {
            el.innerText = `Meta geral (%): ${meta.toFixed(2)}%`;
        }
    }

    function renderizar() {
        // Ordena os dados do maior para o menor com base na porcentagem (valores nulos ao final)
        dados.sort((a, b) => {
            const pa = (a.porcentagem === null || a.porcentagem === undefined || isNaN(a.porcentagem)) ? -Infinity : a.porcentagem;
            const pb = (b.porcentagem === null || b.porcentagem === undefined || isNaN(b.porcentagem)) ? -Infinity : b.porcentagem;
            return pb - pa;
        });

        const tbody = document.getElementById("tabela-corpo");
        tbody.innerHTML = "";

        dados.forEach((item, index) => {
            let tr = document.createElement("tr");
            
            let tdColocacao = document.createElement("td");
            tdColocacao.className = "center";
            tdColocacao.innerText = `${index + 1}º`;
            
            let tdSetor = document.createElement("td");
            tdSetor.innerText = item.setor;
            
            let tdPorcentagem = document.createElement("td");
            let input = document.createElement("input");
            input.type = "number";
            input.step = "0.01";
            // mostra vazio se for null
            input.value = item.porcentagem ?? '';
            
            // Cancela o timeout anterior e aguarda 5 segundos antes de renderizar novamente
            input.oninput = (e) => {
                const raw = e.target.value;
                const val = parseFloat(raw);
                // Se o campo estiver vazio ou inválido, guardamos null para que a média ignore
                item.porcentagem = raw === '' || isNaN(val) ? null : val;
                
                // Limpa o timeout anterior se existir
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                
                // Mostra que está aguardando
                document.getElementById('status-timeout').innerHTML = '<span class="timeout-ativo">⏱️ Atualizando em 5 segundos...</span>';
                
                // Define novo timeout
                timeoutId = setTimeout(() => {
                    renderizar();
                    document.getElementById('status-timeout').innerHTML = '✅ Ranking atualizado!';
                    setTimeout(() => {
                        document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
                    }, 2000);
                }, TEMPO_ESPERA);
            };
            
            tdPorcentagem.appendChild(input);
            tr.appendChild(tdColocacao);
            tr.appendChild(tdSetor);
            tr.appendChild(tdPorcentagem);
            tbody.appendChild(tr);
        });

        // Atualiza meta geral na UI
        atualizarMetaGeralNaTela();
    }

    function prepararExportacao() {
        // Prepara a tabela de exportação com os dados ordenados
        const dadosOrdenados = [...dados].sort((a, b) => {
            const pa = (a.porcentagem === null || a.porcentagem === undefined || isNaN(a.porcentagem)) ? -Infinity : a.porcentagem;
            const pb = (b.porcentagem === null || b.porcentagem === undefined || isNaN(b.porcentagem)) ? -Infinity : b.porcentagem;
            return pb - pa;
        });

        const tabelaExport = document.getElementById("tabela-export");
        tabelaExport.innerHTML = "";

        const metaGeral = calcularMetaGeral();
        document.getElementById("meta-valor-export").innerText = (metaGeral === null ? "—" : metaGeral.toFixed(2) + "%");

        dadosOrdenados.forEach((item, index) => {
            let tr = document.createElement("tr");
            
            let tdColocacao = document.createElement("td");
            tdColocacao.style.cssText = "padding: 15px; border: 2px solid #ddd; text-align: center; font-weight: bold; font-size: 16px;";
            tdColocacao.innerText = `${index + 1}º`;
            
            let tdSetor = document.createElement("td");
            tdSetor.style.cssText = "padding: 15px; border: 2px solid #ddd; font-size: 16px;";
            tdSetor.innerText = item.setor;
            
            let tdPorcentagem = document.createElement("td");
            tdPorcentagem.style.cssText = "padding: 15px; border: 2px solid #ddd; text-align: right; font-size: 16px; font-weight: bold;";
            const pct = (item.porcentagem === null || item.porcentagem === undefined || isNaN(item.porcentagem)) ? "—" : item.porcentagem.toFixed(2) + "%";
            tdPorcentagem.innerText = pct;
            
            tr.appendChild(tdColocacao);
            tr.appendChild(tdSetor);
            tr.appendChild(tdPorcentagem);
            tabelaExport.appendChild(tr);
        });
    }

    function exportarComoImagem() {
        prepararExportacao();
        
        const element = document.getElementById("export-area");
        
        // Mostrar mensagem de processamento
        document.getElementById('status-timeout').innerHTML = '<span class="timeout-ativo">⏱️ Gerando imagem...</span>';
        
        html2canvas(element, {
            scale: 3,
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            logging: false,
            imageTimeout: 0,
            onclone: function(clonedDocument) {
                // Garantir que o documento clonado está pronto
                clonedDocument.getElementById("export-area").style.display = "block";
            }
        }).then(canvas => {
            try {
                // Converter canvas para blob ao invés de dataURL
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `ranking-setores-${new Date().toISOString().split('T')[0]}.jpg`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    document.getElementById('status-timeout').innerHTML = '✅ Imagem exportada com sucesso!';
                    setTimeout(() => {
                        document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
                    }, 3000);
                }, 'image/jpeg', 0.95);
            } catch(error) {
                console.error("Erro ao converter canvas:", error);
                alert("Erro ao exportar imagem. Tente novamente.");
                document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
            }
        }).catch(error => {
            console.error("Erro ao exportar imagem:", error);
            alert("Erro ao exportar imagem. Tente novamente.");
            document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
        });
    }

    function exportarJSON() {
        const dadosOrdenados = [...dados].sort((a, b) => {
            const pa = (a.porcentagem === null || a.porcentagem === undefined || isNaN(a.porcentagem)) ? -Infinity : a.porcentagem;
            const pb = (b.porcentagem === null || b.porcentagem === undefined || isNaN(b.porcentagem)) ? -Infinity : b.porcentagem;
            return pb - pa;
        });
        const metaGeral = calcularMetaGeral();
        const exportData = {
            metaGeral: metaGeral,
            setores: dadosOrdenados,
            dataExportacao: new Date().toISOString()
        };
        const json = JSON.stringify(exportData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranking-setores-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function exportarCSV() {
        const dadosOrdenados = [...dados].sort((a, b) => {
            const pa = (a.porcentagem === null || a.porcentagem === undefined || isNaN(a.porcentagem)) ? -Infinity : a.porcentagem;
            const pb = (b.porcentagem === null || b.porcentagem === undefined || isNaN(b.porcentagem)) ? -Infinity : b.porcentagem;
            return pb - pa;
        });
        const metaGeral = calcularMetaGeral();
        let csv = `Meta Geral (%),${(metaGeral === null ? "—" : metaGeral.toFixed(2))}\n\n`;
        csv += 'Colocação,Setor,Porcentagem (%)\n';
        dadosOrdenados.forEach((item, index) => {
            const pct = (item.porcentagem === null || item.porcentagem === undefined || isNaN(item.porcentagem)) ? '' : item.porcentagem.toFixed(2);
            csv += `${index + 1},"${item.setor}",${pct}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranking-setores-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function limparDados() {
        if (confirm('Tem certeza que deseja restaurar os dados padrão?')) {
            dados = [...DADOS_PADRAO];
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            renderizar();
            document.getElementById('status-timeout').innerHTML = '⏱️ Aguardando edição...';
        }
    }

    // Render inicial
    renderizar();
</script>

</body>
</html>
